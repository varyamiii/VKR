<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ATC Speech Trainer{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="bg-grid"></div>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">ATC</span>
            <span>
                <strong>Speech Trainer</strong>
                <small>Интеллектуальная подготовка авиадиспетчеров</small>
            </span>
        </a>
        <nav class="nav">
            <a href="/training">Учебный режим</a>
            <a href="/test/setup">Тестирование</a>
        </nav>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>ВКР · FastAPI · PostgreSQL · MeloTTS</span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
